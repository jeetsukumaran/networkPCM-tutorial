project:
  type: website
  execute-dir: project
  output-dir: _site
  render:
      - index.qmd
      - topic*.qmd

website:
  title: "Comparative methods on networks"
  site-url: https://juliaphylo.github.io/networkPCM-tutorial
  repo-url: https://github.com/JuliaPhylo/networkPCM-tutorial
  repo-actions: [issue]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: https://juliaphylo.github.io/PhyloNetworks.jl/v1.1/
        text: PhyloNetworks
    right:
      - icon: github
        href: https://github.com/JuliaPhylo/networkPCM-tutorial
  sidebar:
    style: "docked"
    search: true
    contents:
      - href: index.qmd
        text: Home
      - topic1-installation.qmd
      - topic2-getstarted.qmd
      - topic3-averagedistances.qmd
      - topic4-netcalibration.qmd
      - topic5-phyloANOVA.qmd
      - topic6-asr.qmd
      - topic7-impactgeneflow.qmd
      - topic8-discrete.qmd
      - topic9-visualization.qmd
  page-navigation: true

format:
  html:
    respect-user-color-scheme: true
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true

# No RCall/R dependency remains, so the old "each Rcall call needs its own
# environment" reason for pinning the jupyter engine is gone. The native
# `engine: julia` project setting was tried and did not render reliably in
# testing, so this still uses the jupyter engine with an IJulia kernel;
# match the kernel name below to whatever `julia -v` reports on your machine.
jupyter: julia-1.12
